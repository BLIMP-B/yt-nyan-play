name: Desktop tests and Windows package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:desktop
      - run: npm test
      - run: xvfb-run --auto-servernum npm run smoke:desktop
  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke:desktop
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: nyan-play-windows-x64
          path: |
            dist/desktop/*.exe
            dist/desktop/*.zip
          if-no-files-found: error
