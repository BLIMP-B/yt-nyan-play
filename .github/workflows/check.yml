name: Check and package extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: yt-nyan-play-extension
          path: dist/*.zip
          if-no-files-found: error
