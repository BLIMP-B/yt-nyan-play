name: Extension display verification
on:
  push:
    paths:
      - 'extension/**'
      - 'scripts/verify-extension*.mjs'
      - 'scripts/extension-gallery.py'
      - 'tests/extension.test.mjs'
      - 'tests/fixtures/extension/**'
      - 'package.json'
      - '.github/workflows/extension-verify.yml'
  pull_request:
    paths:
      - 'extension/**'
      - 'scripts/verify-extension*.mjs'
      - 'scripts/extension-gallery.py'
      - 'tests/extension.test.mjs'
      - 'tests/fixtures/extension/**'
      - 'package.json'
      - '.github/workflows/extension-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: npm run check
      - run: node --test tests/extension.test.mjs
      - run: npm run verify:extension
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/extension-gallery.py
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-display-fixtures
          path: dist/extension-verification
      - uses: actions/upload-artifact@v4
        with:
          name: extension-0.2.1-verified
          path: dist/yt-nyan-play-*.zip
          if-no-files-found: error
  public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Inspect public site pages and save actual screenshots
        run: node scripts/verify-extension-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-display-public-pages
          path: dist/extension-live
